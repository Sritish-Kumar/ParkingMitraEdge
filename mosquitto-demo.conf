# Mosquitto config for the ParkingMitra demo.
#
# Two listeners on the same broker:
#   1883 - normal MQTT, used by the edge node (Python)
#   9001 - MQTT over WebSockets, used by the browser
#
# A browser cannot open a raw TCP socket, so it cannot speak plain MQTT.
# The websockets listener wraps the same protocol in something the
# browser CAN open. Same broker, same topics, same messages.

listener 1883
protocol mqtt
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true