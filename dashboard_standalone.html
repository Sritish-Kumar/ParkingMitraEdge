    <style>
      /* ------------------------------------------------------------------
     Palette taken from the lot itself: concrete, yellow line-paint,
     and the red used on enforcement signage.
     ------------------------------------------------------------------ */
      :root {
        --concrete: #dedbd4;
        --panel: #ffffff;
        --ink: #22262a;
        --muted: #6e757b;
        --hairline: #c7c3ba;
        --paint: #d9a21b;
        --ok: #2f7d5e;
        --bad: #b4342a;
        --empty: #8c9298;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--concrete);
        color: var(--ink);
        font-family: "Barlow Semi Condensed", system-ui, sans-serif;
        font-size: 16px;
        line-height: 1.4;
      }

      .shell {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 20px;
        max-width: 1500px;
        margin: 0 auto;
        padding: 20px;
      }

      /* ---------------- header ---------------- */

      header {
        grid-column: 1 / -1;
        display: flex;
        align-items: baseline;
        gap: 18px;
        border-bottom: 2px solid var(--ink);
        padding-bottom: 10px;
      }
      h1 {
        font-size: 26px;
        font-weight: 600;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .site {
        color: var(--muted);
        font-size: 17px;
      }

      .link {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 16px;
        font-variant-numeric: tabular-nums;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--empty);
      }
      .dot.live {
        background: var(--ok);
      }
      .dot.lost {
        background: var(--bad);
      }

      /* ---------------- camera view ---------------- */

      .view {
        position: relative;
        background: var(--ink);
        border: 2px solid var(--ink);
        line-height: 0;
        min-height: 240px;
      }
      .view img {
        width: 100%;
        display: block;
      }
      .view svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #viewMsg[hidden] {
        display: none;
      }
      #viewMsg {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 16px;
        color: #c7c3ba;
        font-size: 15px;
        line-height: 1.4;
      }

      #err {
        grid-column: 1 / -1;
        background: var(--bad);
        color: #fff;
        padding: 10px 16px;
        font-size: 14px;
        white-space: pre-wrap;
      }

      .slot {
        stroke-width: 3;
        transition:
          fill 240ms ease,
          stroke 240ms ease;
      }
      .slot.EMPTY {
        fill: rgba(255, 255, 255, 0.1);
        stroke: var(--paint);
      }
      .slot.OK {
        fill: rgba(47, 125, 94, 0.42);
        stroke: #7dd8b0;
      }
      .slot.BAD {
        fill: rgba(180, 52, 42, 0.52);
        stroke: #ff8a7a;
      }

      .slot.flash {
        animation: flash 1.6s ease-out 2;
      }
      @keyframes flash {
        0%,
        100% {
          stroke-width: 3;
        }
        50% {
          stroke-width: 8;
        }
      }

      .tag {
        font-size: 20px;
        font-weight: 600;
        fill: #fff;
        paint-order: stroke;
        stroke: rgba(0, 0, 0, 0.7);
        stroke-width: 4px;
      }

      /* ---------------- side rail ---------------- */

      .rail {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--hairline);
        padding: 14px 16px;
      }
      .card h2 {
        font-size: 15px;
        font-weight: 600;
        color: var(--muted);
        margin: 0 0 10px;
      }

      /* occupancy as one bar, not three big numbers — it shows the lot's
     shape at a glance, which is what an operator actually wants */
      .bar {
        display: flex;
        height: 26px;
        border: 1px solid var(--hairline);
        overflow: hidden;
      }
      .bar span {
        transition: flex-grow 320ms ease;
      }
      .bar .b-ok {
        background: var(--ok);
      }
      .bar .b-bad {
        background: var(--bad);
      }
      .bar .b-empty {
        background: repeating-linear-gradient(
          45deg,
          #efede8,
          #efede8 5px,
          #e3e0d9 5px,
          #e3e0d9 10px
        );
      }

      .legend {
        display: flex;
        gap: 14px;
        margin-top: 9px;
        font-size: 16px;
        font-variant-numeric: tabular-nums;
      }
      .legend b {
        font-weight: 600;
      }
      .key {
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-right: 5px;
      }

      .log {
        max-height: 460px;
        overflow-y: auto;
      }
      .log ol {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .log li {
        border-top: 1px solid var(--hairline);
        padding: 8px 0;
        display: flex;
        gap: 10px;
      }
      .log li:first-child {
        border-top: 0;
      }
      .time {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .what b {
        font-weight: 600;
      }
      .what.bad b {
        color: var(--bad);
      }
      .what.ok b {
        color: var(--ok);
      }
      .why {
        color: var(--muted);
      }

      .hint {
        color: var(--muted);
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
      @media (max-width: 900px) {
        .shell {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <div class="shell">
      <header>
        <h1 id="cam">CAM_01</h1>
        <span class="site" id="site">loading</span>
        <span class="link"
          ><span class="dot" id="dot"></span
          ><span id="linkText">connecting</span></span
        >
      </header>

      <div id="err" hidden></div>

      <div class="view">
        <img
          id="photo"
          alt="Parking area viewed from CAM_01"
          onload="document.getElementById('viewMsg').hidden = true"
          onerror="document.getElementById('viewMsg').textContent = 'camera image failed to load'"
        />
        <svg id="overlay" preserveAspectRatio="none"></svg>
        <div id="viewMsg">loading camera view…</div>
      </div>

      <div class="rail">
        <div class="card">
          <h2>Slot occupancy</h2>
          <div class="bar">
            <span class="b-ok" id="barOk" style="flex-grow: 0"></span>
            <span class="b-bad" id="barBad" style="flex-grow: 0"></span>
            <span class="b-empty" id="barEmpty" style="flex-grow: 1"></span>
          </div>
          <div class="legend">
            <span
              ><i class="key" style="background: var(--ok)"></i>Parked
              <b id="nOk">0</b></span
            >
            <span
              ><i class="key" style="background: var(--bad)"></i>Violation
              <b id="nBad">0</b></span
            >
            <span
              ><i class="key" style="background: #e3e0d9"></i>Free
              <b id="nEmpty">0</b></span
            >
          </div>
        </div>

        <div class="card log">
          <h2>Recent changes</h2>
          <ol id="log">
            <li>
              <span class="hint">Waiting for the first slot change.</span>
            </li>
          </ol>
        </div>
      </div>
    </div>

    <script>
      // ---------------------------------------------------------------------
      // Change these three if your paths differ.
      // ---------------------------------------------------------------------
      // If anything below throws, say so on the page rather than leaving
      // the viewer staring at a blank panel.
      window.addEventListener("error", (e) => {
        const box = document.getElementById("err");
        if (box) {
          box.hidden = false;
          box.textContent =
            "Script error: " + (e.message || (e.error && e.error.message) || "see console");
        }

      const svg = document.getElementById("overlay");
      const NS = "http://www.w3.org/2000/svg";
      const shapes = {}; // slot_id -> <polygon>
      let states = {}; // slot_id -> EMPTY | OK | BAD
      let firstEvent = true;

      // ---- 1. draw the slots from your calibration file -------------------

      async function drawSlots() {
        const data = SLOTS_INLINE;

        document.getElementById("cam").textContent = data.camera_id;
        document.getElementById("photo").src = PHOTO_URL;

        const [w, h] = data.image_size;
        svg.setAttribute("viewBox", `0 0 ${w} ${h}`);

        for (const slot of data.slots) {
          const poly = document.createElementNS(NS, "polygon");
          poly.setAttribute(
            "points",
            slot.polygon.map((p) => p.join(",")).join(" "),
          );
          poly.setAttribute("class", "slot EMPTY");
          svg.appendChild(poly);
          shapes[slot.slot_id] = poly;
          states[slot.slot_id] = "EMPTY";

          const tag = document.createElementNS(NS, "text");
          tag.setAttribute("x", slot.center[0]);
          tag.setAttribute("y", slot.center[1]);
          tag.setAttribute("text-anchor", "middle");
          tag.setAttribute("class", "tag");
          tag.textContent = slot.slot_id;
          svg.appendChild(tag);
        }
        document.getElementById("viewMsg").hidden = true;
        paintCounts();
      }

      // ---- 2. paint ------------------------------------------------------

      function setSlot(id, state, flash) {
        const shape = shapes[id];
        if (!shape) return;
        states[id] = state;
        shape.setAttribute("class", "slot " + state + (flash ? " flash" : ""));
        if (flash)
          setTimeout(() => shape.setAttribute("class", "slot " + state), 3400);
      }

      function paintCounts() {
        const all = Object.values(states);
        const n = (s) => all.filter((v) => v === s).length;
        const ok = n("OK"),
          bad = n("BAD"),
          empty = n("EMPTY");

        document.getElementById("nOk").textContent = ok;
        document.getElementById("nBad").textContent = bad;
        document.getElementById("nEmpty").textContent = empty;
        document.getElementById("barOk").style.flexGrow = ok;
        document.getElementById("barBad").style.flexGrow = bad;
        document.getElementById("barEmpty").style.flexGrow = empty;
      }

      function addLogLine(m) {
        const list = document.getElementById("log");
        if (firstEvent) {
          list.innerHTML = "";
          firstEvent = false;
        }

        const li = document.createElement("li");
        const t = new Date(m.observed_at).toLocaleTimeString([], {
          hour12: false,
        });
        const cls =
          m.new_state === "BAD" ? "bad" : m.new_state === "OK" ? "ok" : "";
        const score = m.score == null ? "" : ` · ${m.score.toFixed(1)}`;

        li.innerHTML =
          `<span class="time">${t}</span>` +
          `<span class="what ${cls}"><b>${m.slot_id}</b> ${m.prev_state} to ${m.new_state}` +
          `<br><span class="why">${m.reason}${score}</span></span>`;

        list.prepend(li);
        while (list.children.length > 40) list.lastChild.remove();
      }

      // ---- 3. subscribe --------------------------------------------------

      function link(state, text) {
        document.getElementById("dot").className = "dot " + state;
        document.getElementById("linkText").textContent = text;
      }

      function start() {
        if (!window.mqtt) {
          link("lost", "mqtt.js not loaded");
          document.getElementById("log").innerHTML =
            `<li><span class="hint">Could not load mqtt.min.js from the CDN. ` +
            `Check internet access, or use a local copy of mqtt.min.js.</span></li>`;
          return;
        }

        const client = mqtt.connect(BROKER, {
          clientId: `dashboard-${Math.random().toString(16).slice(2)}`,
        });

        client.on("connect", () => {
          link("live", "live");
          client.subscribe("pm/#");
        });
        client.on("reconnect", () => link("", "reconnecting"));
        client.on("close", () => link("lost", "broker unreachable"));
        client.on("error", () => link("lost", "broker unreachable"));

        client.on("message", (topic, buf) => {
          let m;
          try {
            m = JSON.parse(buf.toString());
          } catch {
            return;
          }

          if (m.event_type === "HEARTBEAT") {
            // full picture — repaints everything, so a page refresh recovers
            document.getElementById("site").textContent =
              `${m.site_id} · camera ${m.camera_status.toLowerCase()}`;
            for (const [id, state] of Object.entries(m.slots))
              setSlot(id, state, false);
            paintCounts();
          }

          if (m.event_type === "SLOT_STATE_CHANGED") {
            // one slot changed — flash it and record it
            setSlot(m.slot_id, m.new_state, true);
            paintCounts();
            addLogLine(m);
          }
        });
      }

      drawSlots()
        .then(start)
        .catch((err) => {
          document.getElementById("log").innerHTML =
            `<li><span class="hint">Could not draw the dashboard: ${err.message}</span></li>`;
          document.getElementById("viewMsg").textContent = "dashboard failed to start";
          console.error(err);
        });
    </script>
