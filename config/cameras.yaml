# Camera registry.
#
# `source` can be an rtsp:// URL (production) or a local video file (demo).
# Adding a camera = a block here + a slot file. No code change.

site_id: BLR01

cameras:
  - camera_id: CAM_01
    source: testdata/lot1.mp4
    sample_fps: 5
    slot_file: config/slots/CAM_01.json
    enabled: true
